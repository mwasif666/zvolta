server {
    listen 80;
    listen [::]:80;
    server_name zvolta.com www.zvolta.com;

    return 301 https://zvolta.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.zvolta.com;

    ssl_certificate /etc/letsencrypt/live/zvolta.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zvolta.com/privkey.pem;

    return 301 https://zvolta.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name zvolta.com;

    ssl_certificate /etc/letsencrypt/live/zvolta.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zvolta.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/zvolta.com/chain.pem;

    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;

    access_log /var/log/nginx/zvolta.com.access.log;
    error_log /var/log/nginx/zvolta.com.error.log;

    location /.well-known/acme-challenge/ {
        root /home/zvolta-website;
    }

    root /home/zvolta-website/dist;
    index index.html;

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* \.(?:avif|gif|ico|jpe?g|png|svg|webp|woff2?)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
